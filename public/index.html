<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express AI – College Group Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">
  <header class="flex justify-between items-center p-4 bg-gray-800">
    <h1 class="text-2xl font-bold">🎓 College Students Group Chat</h1>
    <div id="authButtons"></div>
  </header>

  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></main>

  <footer class="p-4 bg-gray-800 flex">
    <input id="chatInput" class="flex-1 p-2 rounded bg-gray-700 text-white"
      placeholder="Type @expressai to ask AI..." />
    <button id="sendBtn" class="ml-2 px-4 py-2 bg-blue-600 rounded">Send</button>
  </footer>

  <script type="module" src="./js/firebase.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
