<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Express AI — College</title>
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(180deg,#071026 0%, #081427 100%); }
    .bubble { max-width:78%; padding:10px 14px; border-radius:12px; }
  </style>
</head>
<body class="h-screen text-white flex flex-col">
  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="w-72 bg-gray-850 p-4 border-r border-white/6 flex flex-col">
      <div class="mb-4">
        <h1 class="text-xl font-semibold">Express AI</h1>
        <p class="text-xs text-white/70">College Students Platform</p>
      </div>
      <div class="mb-3">
        <button id="newRoomBtn" class="w-full py-2 bg-indigo-600 rounded">+ New Room</button>
      </div>
      <div class="flex-1 overflow-auto" id="roomsList"></div>
      <div id="authButtons" class="mt-4"></div>
    </aside>

    <!-- Main area -->
    <main class="flex-1 flex flex-col">
      <header class="p-4 border-b border-white/6 flex items-center justify-between">
        <div>
          <h2 id="roomTitle" class="text-lg font-semibold">College Students Group Chat</h2>
          <div id="roomMeta" class="text-xs text-white/60">public • AI: @expressai (tag to call)</div>
        </div>
        <div class="flex items-center gap-3">
          <select id="modelSelect" class="bg-transparent border border-white/6 rounded px-2 py-1">
            <option value="gpt-4o-mini">gpt-4o-mini</option>
            <option value="gpt-4o">gpt-4o</option>
            <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
          </select>
          <button id="announceBtn" class="px-3 py-1 bg-yellow-600 rounded">Announce</button>
        </div>
      </header>

      <section id="chatArea" class="flex-1 p-4 overflow-auto bg-gradient-to-b from-black/10 to-transparent">
        <div id="messages" class="space-y-3"></div>
      </section>

      <footer class="p-4 bg-gray-800 flex gap-3 items-center">
        <button id="micBtn" class="px-3 py-2 bg-green-600 rounded">🎤</button>
        <input id="chatInput" placeholder="Type @expressai to mention the assistant..." class="flex-1 p-3 rounded bg-gray-700" />
        <input id="fileInput" type="file" class="hidden" />
        <button id="fileBtn" class="px-3 py-2 bg-gray-600 rounded">📎</button>
        <button id="sendBtn" class="px-4 py-2 bg-indigo-600 rounded">Send</button>
      </footer>
    </main>

    <!-- Right column: presence & admin -->
    <aside class="w-80 bg-gray-850 p-4 border-l border-white/6">
      <h3 class="font-semibold">Online</h3>
      <div id="presenceList" class="mt-2"></div>
      <hr class="my-3 border-white/6" />
      <div id="adminPanel"></div>
    </aside>
  </div>

  <script type="module" src="/js/firebase.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
