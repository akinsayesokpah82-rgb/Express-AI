<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Express AI — College Hub</title>
  <meta name="description" content="Express AI — created by Akin S. Sokpah. Group chat, tutors, news, sports, weather, song generator, payments & membership." />
  <meta name="google-site-verification" content="-76G_hyg_NddKczNsJ1o256fMZuyM2OJGLH_elN2BCo" />
  <meta name="google-site-verification" content="tpgWFUV2efWteh-q3mPwS6zTbHR0llUfimFDqXksQjQ" />
  <link rel="manifest" href="/manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <div class="flex flex-1">
    <!-- Sidebar -->
    <aside class="w-80 p-4 border-r border-white/6 flex flex-col">
      <div>
        <h1 class="text-2xl font-bold">🤖 Express AI</h1>
        <p class="text-xs text-white/70">College Students Hub</p>
      </div>

      <div class="mt-4 space-y-2">
        <button id="joinBtn" class="w-full py-2 bg-amber-600 rounded">Join / Pay</button>
        <button id="newsBtn" class="w-full py-2 bg-gray-700 rounded">Latest News</button>
        <button id="sportsBtn" class="w-full py-2 bg-gray-700 rounded">Sports Update</button>
        <button id="weatherBtn" class="w-full py-2 bg-gray-700 rounded">Weather</button>
      </div>

      <div class="mt-4">
        <h4 class="text-sm text-white/70 mb-2">Subjects</h4>
        <button id="nursingBtn" class="w-full py-2 bg-gray-700 rounded mb-2">Nursing AI</button>
        <button id="mathBtn" class="w-full py-2 bg-gray-700 rounded mb-2">Math AI</button>
        <button id="englishBtn" class="w-full py-2 bg-gray-700 rounded mb-2">English AI</button>
        <button id="monetizeBtn" class="w-full py-2 bg-gray-700 rounded mb-2">Monetize AI</button>
        <button id="songBtn" class="w-full py-2 bg-gray-700 rounded mb-2">Song Generator</button>
      </div>

      <div id="authButtons" class="mt-auto"></div>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col">
      <header class="p-4 border-b border-white/6 flex items-center justify-between">
        <div>
          <h2 id="roomTitle" class="text-lg font-semibold">College Students Group Chat</h2>
          <div class="text-xs text-white/60">Tag @expressai to get help</div>
        </div>
        <div class="flex items-center gap-3">
          <select id="modelSelect" class="bg-transparent border border-white/6 rounded px-2 py-1">
            <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
            <option value="gpt-4o-mini">gpt-4o-mini</option>
          </select>
        </div>
      </header>

      <section id="chatArea" class="flex-1 p-4 overflow-auto">
        <div id="messages" class="space-y-3"></div>
      </section>

      <footer class="p-4 bg-gray-800 flex gap-3 items-center">
        <input id="chatInput" placeholder="Type @expressai to mention the assistant..." class="flex-1 p-3 rounded bg-gray-700" />
        <input id="fileInput" type="file" class="hidden" />
        <button id="fileBtn" class="px-3 py-2 bg-gray-600 rounded">📎</button>
        <button id="sendBtn" class="px-4 py-2 bg-indigo-600 rounded">Send</button>
      </footer>
    </main>

    <!-- Right -->
    <aside class="w-96 p-4 border-l border-white/6">
      <h3 class="font-semibold">Admin Panel</h3>
      <div id="adminPanel" class="mt-2"></div>
      <hr class="my-3 border-white/6" />
      <h4 class="text-sm text-white/70 mb-2">Contact / Requests</h4>
      <form id="contactForm" class="space-y-2">
        <input id="contactName" placeholder="Full name" class="w-full p-2 rounded bg-gray-800" />
        <input id="contactEmail" placeholder="Email" class="w-full p-2 rounded bg-gray-800" />
        <textarea id="contactMessage" placeholder="Message / Why join?" class="w-full p-2 rounded bg-gray-800"></textarea>
        <button id="contactSubmit" type="button" class="w-full py-2 bg-green-600 rounded">Send Request</button>
        <div id="contactStatus" class="text-xs text-white/60"></div>
      </form>
    </aside>
  </div>

  <script type="module" src="/js/firebase.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
</body>
</html>
