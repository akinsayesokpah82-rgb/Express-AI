  <!-- ✅ Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-white flex flex-col h-screen">
  <header class="flex justify-between items-center p-4 bg-gray-800">
    <h1 class="text-2xl font-bold">🤖 Express AI</h1>
    <div id="authButtons"></div>
  </header>

  <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-3"></main>

  <footer class="p-4 bg-gray-800 flex items-center space-x-2">
    <input id="chatInput" class="flex-1 p-2 rounded bg-gray-700 text-white"
      placeholder="Type @expressai to ask AI..." />
    <button id="sendBtn" class="px-4 py-2 bg-blue-600 rounded">Send</button>
    <button id="micBtn" class="px-3 py-2 bg-gray-700 rounded">🎙️</button>
  </footer>

  <!-- ✅ Firebase & App -->
  <script type="module" src="./js/firebase.js"></script>
  <script type="module" src="./js/app.js"></script>

  <!-- ✅ Voice Synthesis -->
  <script>
    const micBtn = document.getElementById('micBtn');
    const chatInput = document.getElementById('chatInput');

    if ('webkitSpeechRecognition' in window) {
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = false;

      micBtn.onclick = () => {
        recognition.start();
        micBtn.textContent = '🎙️ Listening...';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        chatInput.value = transcript;
        micBtn.textContent = '🎙️';
      };

      recognition.onerror = () => (micBtn.textContent = '🎙️');
    } else {
      micBtn.disabled = true;
      micBtn.title = 'Voice not supported';
    }
  </script>

  <!-- ✅ Typing / AI Thinking Animation -->
  <script>
    const chatContainer = document.getElementById('chatContainer');
    const typingDiv = document.createElement('div');
    typingDiv.className = 'text-gray-400 italic';
    typingDiv.textContent = 'Express AI is thinking...';

    function showTyping() {
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function hideTyping() {
      if (typingDiv.parentNode) typingDiv.remove();
    }
  </script>

</body>
</html>
