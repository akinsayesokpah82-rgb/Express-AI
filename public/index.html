<body class="bg-gray-900 text-white flex flex-col min-h-screen">
  <header class="bg-gray-800 p-4 text-center text-2xl font-bold">
    🤖 Express AI

  <main class="flex-grow flex flex-col items-center justify-center text-center px-4">
    <h1 class="text-3xl font-extrabold mb-2">Hi 👋, I'm Express AI</h1>
    <p class="max-w-xl text-gray-300 mb-6">
      The intelligent assistant built by <b>Akin S. Sokpah</b> — combining the brilliance of GPT & Gemini into one.
    </p>

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-lg p-4">
      <div id="chat-box" class="h-80 overflow-y-auto mb-3 p-2 rounded-lg bg-gray-900"></div>
      <div class="flex">
        <input id="user-input" class="flex-grow bg-gray-700 p-3 rounded-l-lg outline-none" placeholder="Type @expressai your question..." />
        <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-r-lg font-semibold">Send</button>
      </div>
    </div>
  </main>

  <footer class="bg-gray-800 text-gray-400 text-sm py-3 text-center">
    © 2025 Express AI — Created by Akin S. Sokpah 🇱🇷
  </footer>

  <!-- Chatbot Script -->
  <script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");

    function appendMessage(sender, text) {
      const div = document.createElement("div");
      div.classList.add("my-2", "text-left");
      div.innerHTML = `<b>${sender}:</b> ${text}`;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", async () => {
      const input = userInput.value.trim();
      if (!input) return;
      appendMessage("You", input);
      userInput.value = "";

      if (input.toLowerCase().includes("@expressai")) {
        appendMessage("Express AI", "Thinking...");
        // Replace with your AI API endpoint
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: input })
        });
        const data = await res.json();
        chatBox.lastChild.innerHTML = `<b>Express AI:</b> ${data.reply}`;
      }
    });
  </script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js")
        .then(() => console.log("✅ Service Worker registered"))
        .catch(err => console.error("SW registration failed:", err));
    }
  </script>
